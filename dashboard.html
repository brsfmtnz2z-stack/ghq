  }
  return `
  <div class="section-title"><div>🗺️ 鬼域地图</div><span class="sub">点击格子查看详情</span></div>
  <div class="panel">
    <div class="panel-title">
      <div><span style="color:#ff3333">■</span> 高危鬼域 &nbsp; <span style="color:#ff9933">■</span> 警戒区 &nbsp; <span style="color:#39ff14">■</span> 已控制 &nbsp; <span style="color:#0a1a10">■</span> 未知</div>
      <button class="btn" onclick="render()">重新扫描</button>
    </div>
    <div class="map-grid">${cells}</div>
  </div>`;
};
window.mapClick=(i,c)=>{const names=['高危鬼域','警戒区','已控制','未知区域'];const idx=c==='danger'?0:c==='warning'?1:c==='safe'?2:3;openModal(`坐标 [${(i%20)},${Math.floor(i/20)}]`,`<div style="line-height:2"><div><strong>状态：</strong>${names[idx]}</div><div><strong>信号：</strong>${(60+Math.random()*40).toFixed(1)}%</div><div><strong>扫描时间：</strong>${now()}</div></div>`)};

VIEWS.leaders=()=>`
  <div class="section-title"><div>👤 城市负责人</div></div>
  <div class="panel">
    <table><thead><tr><th>城市</th><th>负责人</th><th>等级</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${DB.leaders.map(l=>`<tr><td>${esc(l.city)}</td><td>${esc(l.name)}</td><td>Lv.${l.level}</td><td>${l.status==='在岗'?'<span style="color:#39ff14">✓ 在岗</span>':l.status==='受伤'?'<span style="color:#ff9933">⚠ 受伤</span>':'<span style="color:#33ccff">'+esc(l.status)+'</span>'}</td><td><button class="btn" onclick="alert('已向 ${esc(l.name)} 发送通讯请求')">通讯</button></td></tr>`).join('')}
    </tbody></table>
  </div>`;

VIEWS.rank=()=>`
  <div class="section-title"><div>🏆 等级排行榜</div></div>
  <div class="stats-grid">
    ${DB.rank.slice(0,3).map((r,i)=>`<div class="stat-card ${['orange','blue','purple'][i]}"><div class="stat-label">NO.${r.rank} · ${esc(r.title)}</div><div class="stat-value" style="font-size:24px">${esc(r.name)}</div><div class="stat-sync">Lv.${r.level} · 贡献 ${fmt(r.contribution)}</div></div>`).join('')}
  </div>
  <div class="panel">
    <table><thead><tr><th>排名</th><th>姓名</th><th>等级</th><th>称号</th><th>贡献值</th></tr></thead><tbody>
    ${DB.rank.map(r=>`<tr><td>#${r.rank}</td><td>${esc(r.name)}</td><td>Lv.${r.level}</td><td>${esc(r.title)}</td><td>${fmt(r.contribution)}</td></tr>`).join('')}
    </tbody></table>
  </div>`;

VIEWS.tasks=()=>`
  <div class="section-title"><div>📋 任务派发</div></div>
  <div class="panel">
    <table><thead><tr><th>任务</th><th>等级</th><th>奖励</th><th>描述</th><th>操作</th></tr></thead><tbody>
    ${DB.tasks.map(t=>{const taken=DB.myTasks.includes(t.id);return `<tr><td><strong>${esc(t.title)}</strong></td><td><span class="tag ${esc(t.level)}">${esc(t.level)}</span></td><td style="color:#39ff14">${t.reward} EXP</td><td class="dim">${esc(t.desc)}</td><td>${taken?`<button class="btn" disabled>已接取</button>`:`<button class="btn" onclick="takeTask(${t.id})">接取</button>`}</td></tr>`}).join('')}
    </tbody></table>
  </div>
  ${DB.myTasks.length?`<div class="panel"><div class="panel-title">📌 我的任务 (${DB.myTasks.length})</div>${DB.myTasks.map(id=>{const t=DB.tasks.find(x=>x.id===id);return `<div class="post-card"><div class="post-title">${esc(t.title)} <span class="tag ${esc(t.level)}">${esc(t.level)}</span></div><div class="post-content">${esc(t.desc)}</div><button class="btn red" onclick="dropTask(${t.id})">放弃任务</button></div>`}).join('')}</div>`:''}`;
window.takeTask=id=>{if(!DB.myTasks.includes(id)){DB.myTasks.push(id);setD('myTasks',DB.myTasks);alert('✓ 任务已接取');render()}};
window.dropTask=id=>{DB.myTasks=DB.myTasks.filter(x=>x!==id);setD('myTasks',DB.myTasks);render()};

VIEWS.report=()=>`
  <div class="section-title"><div>⚠️ 事件上报</div></div>
  <div class="panel">
    <form id="reportForm">
      <div class="form-group"><label>事件标题</label><input type="text" id="rptTitle" required></div>
      <div class="form-group"><label>危险等级</label><select id="rptLevel"><option>S</option><option>A</option><option>B</option><option>C</option></select></div>
      <div class="form-group"><label>所在地区</label><input type="text" id="rptRegion" placeholder="例：亚洲-东区" required></div>
      <div class="form-group"><label>详细描述</label><textarea id="rptDesc" required></textarea></div>
      <button type="submit" class="btn">提交上报</button>
    </form>
  </div>
  ${DB.reports.length?`<div class="panel"><div class="panel-title">📌 我的上报记录 (${DB.reports.length})</div>${DB.reports.slice().reverse().map(r=>`<div class="post-card"><div class="post-title">${esc(r.title)} <span class="tag ${esc(r.level)}">${esc(r.level)}</span></div><div class="post-meta">${esc(r.region)} · ${esc(r.time)}</div><div class="post-content">${esc(r.desc)}</div></div>`).join('')}</div>`:''}`;

VIEWS.community=()=>`
  <div class="section-title"><div>💬 社区论坛</div></div>
  <div class="panel">
    <div class="panel-title">发表新帖 <button class="btn" onclick="togglePostForm()">展开/收起</button></div>
    <form id="postForm" style="display:none">
      <div class="form-group"><input type="text" id="postTitle" placeholder="帖子标题" required></div>
      <div class="form-group"><textarea id="postContent" placeholder="帖子内容" required></textarea></div>
      <button type="submit" class="btn">发布</button>
    </form>
  </div>
  <div id="postList">
  ${DB.posts.slice().reverse().map(p=>`<div class="post-card"><div class="post-title">${esc(p.title)}</div><div class="post-meta">${esc(p.user)} · ${esc(p.time)}</div><div class="post-content">${esc(p.content)}</div><button class="btn" onclick="likePost(${p.id})">♥ 点赞 (${p.likes})</button></div>`).join('')}
  </div>`;
window.togglePostForm=()=>{const f=document.getElementById('postForm');f.style.display=f.style.display==='none'?'block':'none'};
window.likePost=id=>{const p=DB.posts.find(x=>x.id===id);if(p){p.likes++;setD('posts',DB.posts);render()}};

VIEWS.chat=()=>`
  <div class="section-title"><div>📻 内网聊天室</div></div>
  <div class="panel">
    <div class="chat-box" id="chatBox">
      ${DB.chat.map(m=>`<div class="chat-msg ${m.system?'system':''}"><span class="name">${esc(m.user)}:</span>${esc(m.msg)}<span class="time">${esc(m.time)}</span></div>`).join('')}
    </div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="输入消息，回车发送...">
      <button class="btn" onclick="sendChat()">发送</button>
    </div>
  </div>`;
window.sendChat=()=>{const inp=document.getElementById('chatInput');const v=inp.value.trim();if(!v)return;DB.chat.push({id:Date.now(),user:session.displayName,msg:v,time:hm(),system:false});setD('chat',DB.chat);inp.value='';render();setTimeout(()=>{const b=document.getElementById('chatBox');if(b)b.scrollTop=b.scrollHeight},50)};

VIEWS.vote=()=>`
  <div class="section-title"><div>🗳️ 投票中心</div></div>
  ${DB.votes.map(v=>{const total=v.votes.reduce((a,b)=>a+b,0);return `<div class="panel"><div class="panel-title">${esc(v.title)}<span class="dim" style="font-size:11px">共 ${total} 票</span></div>${v.options.map((o,i)=>{const pct=total>0?(v.votes[i]/total*100).toFixed(1):0;const voted=v.userVoted>=0;return `<div class="vote-option ${voted?'voted':''}" onclick="${voted?'':`castVote(${v.id},${i})`}"><div class="fill" style="width:${voted?pct:0}%"></div><span class="label">${esc(o)}</span><span class="pct">${voted?pct+'%':''}</span></div>`}).join('')}</div>`}).join('')}`;
window.castVote=(vid,opt)=>{const v=DB.votes.find(x=>x.id===vid);if(!v||v.userVoted>=0)return;v.votes[opt]++;v.userVoted=opt;setD('votes',DB.votes);render()};

/* ====== 渲染 ====== */
function render(){
  const f=VIEWS[state.view]||VIEWS.overview;
  document.getElementById('viewContainer').innerHTML=f();
  document.querySelectorAll('.sidebar-menu li[data-view]').forEach(li=>li.classList.toggle('active',li.dataset.view===state.view));
  if(state.view==='chat'){const b=document.getElementById('chatBox');if(b)b.scrollTop=b.scrollHeight}
  if(state.view==='report'){const form=document.getElementById('reportForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();DB.reports.push({title:document.getElementById('rptTitle').value,level:document.getElementById('rptLevel').value,region:document.getElementById('rptRegion').value,desc:document.getElementById('rptDesc').value,time:now()});setD('reports',DB.reports);alert('✓ 事件已上报总部');render()})}
  if(state.view==='community'){const form=document.getElementById('postForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();DB.posts.push({id:Date.now(),user:session.displayName,title:document.getElementById('postTitle').value,content:document.getElementById('postContent').value,time:now(),likes:0});setD('posts',DB.posts);render()})}
}

document.getElementById('sidebarMenu').addEventListener('click',e=>{
  const li=e.target.closest('li[data-view]');if(!li)return;
  state.view=li.dataset.view;render();
});
document.getElementById('logoutBtn').addEventListener('click',()=>{if(confirm('确认退出登录?')){sessionStorage.removeItem('ghq_session');location.href='login.html'}});
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  const ev=DB.events.find(x=>(x.title+x.code+x.desc).toLowerCase().includes(q));
  const it=DB.items.find(x=>(x.name+x.effect).toLowerCase().includes(q));
  if(ev){viewEvent(ev.id);return}
  if(it){viewItem(it.id);return}
  alert('未找到匹配结果: '+q);
});
render();
/* 数据跳动 */
setInterval(()=>{
  DB.stats.death+=Math.floor(Math.random()*20);
  DB.stats.missing+=Math.floor(Math.random()*15);
  DB.stats.infected+=Math.floor(Math.random()*200);
  DB.stats.events+=Math.floor(Math.random()*5);
  setD('stats',DB.stats);
  if(state.view==='overview'||state.view==='stats')render();
},5000);
</script>
</body>
</html>
